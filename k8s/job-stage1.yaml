# Stage 1: the development round for one checkpoint.
#
# Runs only after that checkpoint has passed Stage 0. It measures the readout
# over the development pools - the existing gate-passing families and the eight
# name pairs reserved permanently for development - at both context levels, and
# evaluates every blocking diagnostic on the result.
#
# Nothing measured here may reappear in the confirmatory collection. The readout
# is deterministic, so recollecting a development prompt reproduces the
# development measurement rather than producing an independent observation; the
# name pool enforces that split at load time and the plan cannot draw across it.
#
# The realistic context variant is bound per job. Employer context alone is
# evaluated first; the selectivity fallback is a second job, run only if the
# first fails its criterion.
#
# Substitute the placeholders before applying:
#   sed -e 's|__MODEL_KEY__|mistral-small-24b|' \
#       -e 's|__MODEL_ID__|mistralai/Mistral-Small-24B-Instruct-2501|' \
#       -e 's|__MODEL_REVISION__|9527884be6e5616bdd54de542f9ae13384489724|' \
#       -e 's|__CONTEXT_VARIANT__|employer|' \
#       -e 's|__LABEL__|stage1a|' \
#       k8s/job-stage1.yaml | kubectl apply -f -
#
# Never wait on this with `kubectl wait`; use scripts/await_job.py.
apiVersion: batch/v1
kind: Job
metadata:
  name: hiringcue-stage1-__MODEL_KEY__-__LABEL__
spec:
  # No retries, for the reason the diagnose step below states: a failing
  # diagnostic is this job's result and it exits non-zero to say so. A retry
  # budget cannot tell that apart from a crash, so it would re-run a recorded
  # failure on a fresh accelerator drawn from a shared quota.
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      # The typed accelerator resource does not carry a memory capacity: the same
      # key is satisfied by 40GB and 80GB devices, and a 24B checkpoint in
      # bfloat16 does not fit the smaller one. Constraining the product is a
      # capacity requirement here, not an attempt to pin numerical behaviour.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: __GPU_PRODUCTS__
      containers:
        - name: stage1
          image: pytorch/pytorch:2.5.1-cuda12.1-cudnn9-runtime
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              cd /cache/hiringcue-source-p1-d065
              pip install --no-cache-dir -e .

              SNAPSHOT=/cache/hf/hub/models--${MODEL_ID//\//--}/snapshots/"$MODEL_REVISION"
              test -d "$SNAPSHOT"

              python3 -m hiringcue.cli validate
              # The development-only context levels are carried here and only
              # here. They measure whether the published amplification depends
              # on the employer being recognisable, which the fictitious
              # employer cannot answer about itself; the confirmatory estimand
              # crosses `bare` with `realistic` alone and never sees them.
              python3 -m hiringcue.cli plan \
                --pool development \
                --realistic-variant "$CONTEXT_VARIANT" \
                --development-contexts \
                --plan-dir /cache/plan/"$LABEL"

              python3 -m hiringcue.cli measure \
                --model "$MODEL_KEY" \
                --label "$LABEL" \
                --pool development \
                --model-path "$SNAPSHOT" \
                --plan-dir /cache/plan/"$LABEL" \
                --out /cache/readings/"$LABEL"

              # A failed diagnostic returns non-zero, which is the job's own
              # result rather than an error: a checkpoint whose readout cannot be
              # read is a finding, and it must not be carried forward silently.
              python3 -m hiringcue.cli diagnose \
                --readings /cache/readings/"$LABEL" \
                --stage0 /cache/stage0/stage0__"$MODEL_KEY".json \
                --out /cache/analysis/"$LABEL"
          env:
            - name: MODEL_KEY
              value: "__MODEL_KEY__"
            - name: MODEL_ID
              value: "__MODEL_ID__"
            - name: MODEL_REVISION
              value: "__MODEL_REVISION__"
            - name: CONTEXT_VARIANT
              value: "__CONTEXT_VARIANT__"
            - name: LABEL
              value: "__LABEL__"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /cache/hf
          resources:
            requests:
              nvidia.com/a100: 1
              cpu: "8"
              memory: 64Gi
            limits:
              nvidia.com/a100: 1
              cpu: "8"
              memory: 64Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: hiringcue-cache
