# Rebuilds the combined analysis for a run label and evaluates the blocking
# pilot diagnostics. It requests no accelerator: response generation is already
# complete, and every operation here is CPU-bound.
#
# Substitute __RUN_LABEL__ before applying. The diagnostic command's exit code
# is persisted with the report. A scientifically blocked model is therefore a
# completed analysis job, not an infrastructure retry.
apiVersion: batch/v1
kind: Job
metadata:
  name: hiringcue-analyse-__RUN_LABEL__
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: analyse
          image: python:3.11-slim
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              cd /cache/hiringcue-source
              pip install --no-cache-dir -e .

              python3 -m hiringcue.cli analyse \
                --responses /cache/responses/"$RUN_LABEL" \
                --out /cache/analysis/"$RUN_LABEL"

              set +e
              python3 -m hiringcue.cli gates \
                --responses /cache/responses/"$RUN_LABEL" \
                --out /cache/analysis/"$RUN_LABEL"
              GATE_EXIT=$?
              set -e
              printf '%s\n' "$GATE_EXIT" \
                > /cache/analysis/"$RUN_LABEL"/pilot_gate_exit_code.txt
              echo "pilot diagnostic exit code: $GATE_EXIT"
          env:
            - name: RUN_LABEL
              value: "__RUN_LABEL__"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: hiringcue-cache
