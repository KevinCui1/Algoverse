[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiringcue"
version = "0.1.0"
description = "Counterfactual audit of concealed and direct identity cues in LLM hiring decisions"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.20"]

[project.scripts]
hiringcue = "hiringcue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
