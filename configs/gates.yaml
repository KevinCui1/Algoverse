# Blocking diagnostics on the Yes/No token log-odds readout, per model.
#
# Two kinds of criterion live here and they answer different questions.
#
# The *instrument* criteria decide whether a model's readout may be read at all:
# whether the same prompt returns the same number under an irrelevant change to
# its batch, whether the contrast points at the answer the model would actually
# emit, whether the decision has saturated to the point where the log-odds no
# longer resolves the target effect, and whether the two identity arms are even
# answering the same question. A model failing any of these is dropped and
# recorded as dropped; there is no rescue path and none is to be attempted.
#
# The *determinacy* criteria decide whether the readout has movement the
# qualification rule does not already fix. A readout that is a deterministic
# restatement of the gate arithmetic produces a wide distribution while offering
# an identity cue no room to act, so distributional statistics cannot detect the
# failure. D2 is the positive control that can.
#
# Every threshold is fixed before the round it judges. A failed gate halts the
# confirmatory collection for that model rather than being reported alongside it.

instrument:
  cross_batch_stability:
    description: >-
      Range, across the fixed batch layouts, of the quantity the design
      estimates: the mean over qualified concealed cells of
      mean(Black) - mean(White), where a cell is one scenario family at one
      prompt form and one context level. It is a cell-mean rather than a paired statistic so that it
      needs no matched partner for every arm, and a range rather than a signed
      difference against a nominated reference so that no layout is privileged.
      The predecessor gated on the largest movement of any single prompt, which
      is a stricter question than the study asks and returned a failure its own
      numbers did not support.
    maximum_estimand_range: 0.003
    # One percent of the 0.30 minimum meaningful effect. The derivation is in
    # two steps and neither uses an observed value.
    #
    # The movement is systematic rather than random: it is the same prompt read
    # again under a different tensor shape, so it does not shrink with the
    # number of families or names and cannot be averaged away. It therefore has
    # to be small against the effect itself rather than against the standard
    # error, and one percent of the target is the point at which it cannot move
    # a confirmatory decision - the ambiguity band it creates around the 0.30
    # boundary is +/-0.003, against a selected design whose standard error at
    # the source-calibrated components is 0.084.
    #
    # The floor is not set by measurement noise, because there is none to
    # accommodate. Under a fixed padded length and a fixed batch size the same
    # prompt enters an identically shaped tensor every time, so the expected
    # value of this statistic is exactly zero and the honest threshold would be
    # zero. It is set at 0.003 rather than 0 only to absorb genuine
    # nondeterminism in the accelerator's reduction order, which is orders of
    # magnitude below this and would otherwise make the gate a test of the
    # hardware rather than of the instrument.
    #
    # Registered before the corrected re-run. The observed value under the
    # previous readout is 0.031 to 0.078 across the five checkpoints, so the
    # gate is not meetable unless the shape fix works. That is the point of it:
    # if the fix fails the gate fails loudly rather than being relaxed to
    # accommodate the failure.
    #
    # Per-prompt movement is still computed and reported alongside. It is a
    # diagnostic that localises a mechanism, not a criterion, and no checkpoint
    # is dropped for it.

  logit_greedy_agreement:
    description: >-
      Share of a fixed development-only sample whose greedy next token falls on
      the side of the contrast the contrast itself points at. The contrast is
      only a measurement of the model's answer if the answer it would emit is
      the one the contrast implies. Both an observed rate and a lower confidence
      bound are required, because on a sample of several hundred an observed
      0.95 is consistent with a true rate well below it.
    minimum_observed: 0.95
    minimum_wilson_lower_bound: 0.90
    interval_z: 1.959963984540054

  saturation:
    description: >-
      Share of cells whose implied Yes probability falls outside this interval.
      Near saturation the representable spacing of a bfloat16 log-odds is a
      material fraction of the minimum meaningful effect, so the arithmetic
      quantises the quantity being estimated. Reported as a distribution as well
      as a share.
    probability_interval: [0.02, 0.98]
    maximum_outside_share: 0.40

  differential_off_target_mass:
    description: >-
      Probability mass at the answer position that falls on neither admitted
      variant set, compared across identity arms within counterfactual sets. The
      contrast conditions on the answer being Yes or No, so a systematic arm
      difference in that conditioning means the two arms are answering different
      questions and the contrast cannot see it. This is a screen for a
      qualitative difference - one arm hedging or refusing more than the other -
      rather than a bound on an arithmetic bias, and it is stated as one.
    maximum_paired_arm_difference: 0.05
    maximum_arm_mean: 0.50

determinacy:
  D1_rule_determinacy_r2:
    description: >-
      Within-model R-squared of the token log-odds contrast regressed on gate
      status, minimum gate margin, and their interaction, pooled across
      scenarios. Above 0.95, under five percent of the variance is unexplained
      by the arithmetic and no cue effect of a plausible size can live in the
      residual.
    pass_at_most: 0.80
    warn_range: [0.80, 0.95]
    fail_above: 0.95

  D2_free_parameter_response:
    description: >-
      Median absolute change in token log odds between a scenario and its
      perturbed twin, where the twin alters the soft criteria and touches no
      gate, no gate margin, and no identity field. This is the ceiling on any
      cue effect, and at just over three times the minimum meaningful effect it
      leaves the target an order of magnitude of room below the control.
    pass_at_least: 1.0
    warn_range: [0.5, 1.0]
    fail_below: 0.5

  D3_conditional_dispersion:
    description: >-
      Standard deviation of the token log-odds contrast within the gate-passing
      class, computed within margin band. Conditioning on band is what makes
      this the conditional statistic a marginal histogram cannot provide. The
      floor is provisional on the new scale and is re-derived from the
      development round and recorded before any confirmatory collection.
    pass_at_least: 0.5
    warn_range: [0.25, 0.5]
    fail_below: 0.25

escalation:
  # Two warnings on one model are treated as a failure for that model.
  warns_equal_fail: 2
